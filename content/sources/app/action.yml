name: safe-install check
description: Check a JavaScript project's dependencies for supply-chain risks (npm, pnpm, yarn, bun)
author: crossben
branding:
  icon: shield
  color: orange

inputs:
  working-directory:
    description: Directory containing package.json and the lockfile
    default: .
  fail-on:
    description: Fail when a package reaches this level (low, medium, high, block, none)
    default: high
  min-age:
    description: Minimum release age, e.g. 72h or 3d; 0 disables
    default: 72h
  sarif:
    description: "Upload results to GitHub code scanning (needs `security-events: write`)"
    default: "false"
  diff:
    description: >-
      Which packages to check: "auto" (on pull requests, only packages new or changed
      versus the base branch; otherwise all), "none" (all), or a git ref / old lockfile
    default: auto
  deep:
    description: >-
      Also download and scan the code of the checked packages: "auto" (when diff
      applies, so only the PR's new or changed packages), "true" or "false"
    default: auto
  comment:
    description: >-
      On pull requests, post the summary as a PR comment (updated in place on each run;
      needs `pull-requests: write`). The summary always goes to the job summary
    default: "false"
  version:
    description: Release to use (latest, or a tag like v0.1.0), or "source" to build from this action's checkout
    default: latest

outputs:
  exit-code:
    description: 0 clean, 1 policy failure, 3 tool error
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: inputs.version == 'source'
      with:
        go-version: stable
        cache: false
    - name: Build safe-install from source
      if: inputs.version == 'source'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -trimpath -o "$RUNNER_TEMP/safe-install" ./cmd/safe-install
    - name: Download safe-install
      if: inputs.version != 'source'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux) os=linux; ext=tar.gz ;;
          macOS) os=darwin; ext=tar.gz ;;
          Windows) os=windows; ext=zip ;;
          *) echo "unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "unsupported runner arch: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        if [ "$VERSION" = latest ]; then
          base="https://github.com/crossben/safe-install/releases/latest/download"
        else
          base="https://github.com/crossben/safe-install/releases/download/$VERSION"
        fi
        asset="safe-install_${os}_${arch}.${ext}"
        cd "$RUNNER_TEMP"
        curl -fsSLO "$base/$asset"
        curl -fsSLO "$base/checksums.txt"
        grep " $asset\$" checksums.txt > expected.txt
        if command -v sha256sum >/dev/null; then sha256sum -c expected.txt; else shasum -a 256 -c expected.txt; fi
        if [ "$ext" = zip ]; then unzip -oq "$asset" safe-install.exe && mv safe-install.exe safe-install; else tar xzf "$asset" safe-install; fi
        chmod +x safe-install
        ./safe-install version
    - name: Check dependencies
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        MIN_AGE: ${{ inputs.min-age }}
        SARIF: ${{ inputs.sarif }}
        DIFF: ${{ inputs.diff }}
        DEEP: ${{ inputs.deep }}
      run: |
        args=(check --fail-on "$FAIL_ON" --min-age "$MIN_AGE")
        if [ "$SARIF" = "true" ]; then args+=(--sarif-file "$RUNNER_TEMP/safe-install.sarif"); fi
        summary="$RUNNER_TEMP/safe-install.md"
        rm -f "$summary"
        # Releases before v0.2 have no --summary-file.
        if "$RUNNER_TEMP/safe-install" check --help | grep -q -- --summary-file; then args+=(--summary-file "$summary"); fi
        if [ "$DIFF" = auto ]; then
          DIFF=none
          case "${GITHUB_EVENT_NAME:-}" in
            pull_request|pull_request_target)
              if [ -n "${GITHUB_BASE_REF:-}" ] && git check-ref-format --branch "$GITHUB_BASE_REF" >/dev/null 2>&1 &&
                 git fetch --no-tags --depth=1 origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"; then
                DIFF="origin/$GITHUB_BASE_REF"
              else
                echo "::warning::safe-install: could not fetch the base branch; checking every package"
              fi ;;
          esac
        fi
        if [ "$DIFF" != none ]; then args+=(--diff "$DIFF"); fi
        if [ "$DEEP" = true ] || { [ "$DEEP" = auto ] && [ "$DIFF" != none ]; }; then args+=(--deep); fi
        set +e
        "$RUNNER_TEMP/safe-install" "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -s "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
    - name: Comment on the pull request
      if: inputs.comment == 'true' && always() && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -uo pipefail
        summary="$RUNNER_TEMP/safe-install.md"
        if [ ! -s "$summary" ]; then echo "::warning::safe-install: no summary to post"; exit 0; fi
        marker='<!-- safe-install-report -->'
        id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
          --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$summary" >/dev/null
        elif grep -q '^| ' "$summary"; then
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$summary" >/dev/null
        else
          exit 0 # nothing risky and nothing to update
        fi || echo "::warning::safe-install: could not comment on the pull request (it needs pull-requests: write; fork PRs get a read-only token)"
    - name: Upload to code scanning
      if: inputs.sarif == 'true' && always()
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ runner.temp }}/safe-install.sarif
        category: safe-install
    - name: Result
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.exit-code }}
      run: exit "$CODE"
